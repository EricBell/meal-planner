[project]
name = "meal-planner"
version = "0.1.0"
description = "Automated meal planning with pantry management, Telegram delivery, and Notion sync"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "sqlmodel>=0.0.14",
    "apscheduler>=3.10",
    "python-telegram-bot>=21.0",
    "notion-client>=2.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.26",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "alembic>=1.13",
    "structlog>=24.1",
    "tenacity>=8.2",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.2",
    "mypy>=1.8",
    "httpx>=0.26",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*"]